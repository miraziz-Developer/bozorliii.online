name: Deploy

# CI muvaffaqiyatli bo'lgach main'ni productionga (bitta server) deploy qiladi.
# Kerakli GitHub Secrets: SSH_HOST, SSH_USER, SSH_PRIVATE_KEY, SSH_KNOWN_HOSTS
# (ixtiyoriy: DEPLOY_ALERT_WEBHOOK_URL). Sozlash: docs/DEPLOYMENT.md

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Pin production SSH host key
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          test -n "$SSH_KNOWN_HOSTS" && test -n "$SSH_PRIVATE_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/known_hosts ~/.ssh/id_ed25519

      - name: Deploy
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          HOST: ${{ secrets.SSH_HOST }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$SSH_USER@$HOST" \
            "cd /opt/bozorliii && DEPLOY_SHA='$DEPLOY_SHA' bash scripts/update.sh '$DEPLOY_SHA'"

  smoke-test:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Wait for services to settle
        run: sleep 20
      - name: Check live site
        run: |
          curl -sf https://bozorliii.online/ -o /dev/null && echo "frontend: OK" || (echo "frontend: FAILED" && exit 1)
          curl -sf https://crm.bozorliii.online/ -o /dev/null && echo "crm: OK" || (echo "crm: FAILED" && exit 1)
          curl -sf https://admin.bozorliii.online/ -o /dev/null && echo "admin: OK" || (echo "admin: FAILED" && exit 1)
          curl -sf https://api.bozorliii.online/api/v1/health/ready && echo "" && echo "api: OK" || (echo "api: FAILED" && exit 1)
      - name: Send deploy failure alert
        if: failure()
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.DEPLOY_ALERT_WEBHOOK_URL }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ -n "$ALERT_WEBHOOK_URL" ]; then
            curl -fsS -X POST -H 'Content-Type: application/json' \
              --data "{\"text\":\"Bozorliii production smoke failed for ${DEPLOY_SHA}. Check GitHub Actions immediately.\"}" \
              "$ALERT_WEBHOOK_URL"
          else
            echo "DEPLOY_ALERT_WEBHOOK_URL is not configured; GitHub failure notification remains active."
          fi
